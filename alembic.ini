[alembic]
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally omitted here — env.py reads DATABASE_URL
# from app.core.config.get_settings() instead, so dev/staging/prod each use
# their own .env without editing this file (PRD Ch.12 sec 44-45).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
