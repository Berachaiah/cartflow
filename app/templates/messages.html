{% extends "base.html" %}
{% block content %}
<div data-mx class="relative"
     data-me="{{ current_user.username }}"
     data-open="{{ open_handle or '' }}"
     data-share-slug="{{ share_slug or '' }}"
     data-share-user="{{ share_user or '' }}">

  <div id="mx-shell" class="flex w-full overflow-hidden bg-[var(--c-card,transparent)] lg:border-t border-[color-mix(in_srgb,currentColor_12%,transparent)]" style="height:70vh">

    <!-- LIST -->
    <section id="mx-list" aria-label="Conversations"
             class="flex min-h-0 w-full flex-col lg:w-[23rem] lg:shrink-0 lg:border-r border-[color-mix(in_srgb,currentColor_12%,transparent)]">
      <div class="flex items-center justify-between px-4 pt-4 pb-3">
        <div>
          <h1 class="text-[24px] font-extrabold leading-none tracking-tight">Messages</h1>
          <p class="mt-1 text-[12.5px] opacity-60">Students and businesses, one to one</p>
        </div>
        <button id="mx-new" type="button" aria-label="New message"
                class="flex h-10 w-10 items-center justify-center rounded-full bg-primary text-background shadow-lg transition hover:scale-105 active:scale-95">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">edit_square</span>
        </button>
      </div>

      <div class="px-4 pb-3">
        <label class="flex items-center gap-2 rounded-2xl px-3.5 py-2.5 bg-[color-mix(in_srgb,currentColor_7%,transparent)] focus-within:ring-2 focus-within:ring-primary">
          <span class="material-symbols-outlined text-[20px] opacity-60" aria-hidden="true">search</span>
          <input id="mx-q" type="search" autocomplete="off" placeholder="Search conversations"
                 class="w-full bg-transparent text-[14px] outline-none placeholder:opacity-50">
        </label>
      </div>

      <div id="mx-tabs" class="flex gap-2 px-4 pb-3"></div>
      <div id="mx-rows" class="min-h-0 flex-1 overflow-y-auto px-2 pb-2"></div>
    </section>

    <!-- THREAD -->
    <section id="mx-thread" aria-label="Conversation" class="hidden min-h-0 min-w-0 flex-1 flex-col lg:flex">
      <div id="mx-blank" class="m-auto flex max-w-xs flex-col items-center px-6 text-center">
        <div class="flex h-20 w-20 items-center justify-center rounded-3xl bg-[color-mix(in_srgb,currentColor_7%,transparent)]">
          <span class="material-symbols-outlined text-[38px] opacity-70" aria-hidden="true">forum</span>
        </div>
        <h2 class="mt-5 text-[20px] font-extrabold tracking-tight">Your messages</h2>
        <p class="mt-1.5 text-[14px] opacity-60">Pick a conversation, or start one with someone you follow.</p>
        <button id="mx-new2" type="button" class="mt-5 inline-flex items-center gap-2 rounded-full bg-primary px-5 py-2.5 text-[14px] font-semibold text-background shadow-lg transition hover:scale-105">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">edit_square</span>New message
        </button>
      </div>

      <div id="mx-view" hidden class="min-h-0 flex-1 flex-col" style="display:none">
        <header class="flex items-center gap-3 border-b px-3 py-2.5 border-[color-mix(in_srgb,currentColor_12%,transparent)]">
          <button id="mx-back" type="button" aria-label="Back" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-[color-mix(in_srgb,currentColor_8%,transparent)] lg:hidden">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
          </button>
          <div id="mx-hav"></div>
          <div class="min-w-0 flex-1">
            <div id="mx-hname" class="truncate text-[15px] font-bold leading-tight"></div>
            <div id="mx-hsub" class="truncate text-[12.5px] opacity-60"></div>
          </div>
          <div class="relative">
            <button id="mx-more" type="button" aria-label="More" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-[color-mix(in_srgb,currentColor_8%,transparent)]">
              <span class="material-symbols-outlined" aria-hidden="true">more_vert</span>
            </button>
            <div id="mx-menu" hidden class="absolute right-0 top-11 z-10 w-48 overflow-hidden rounded-2xl border bg-[var(--c-card,#fff)] py-1 text-[14px] shadow-2xl border-[color-mix(in_srgb,currentColor_12%,transparent)]">
              <a id="mx-profile" class="flex items-center gap-2 px-4 py-2.5 hover:bg-[color-mix(in_srgb,currentColor_8%,transparent)]" href="#"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">person</span>View profile</a>
              <button id="mx-block" type="button" class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-red-500 hover:bg-[color-mix(in_srgb,currentColor_8%,transparent)]"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">block</span>Block</button>
            </div>
          </div>
        </header>

        <div id="mx-banner" hidden class="flex items-center justify-between gap-3 px-4 py-3 text-[14px] bg-[color-mix(in_srgb,currentColor_7%,transparent)]">
          <span><b>Message request.</b> Replying accepts it.</span>
          <span class="flex shrink-0 gap-2">
            <button id="mx-accept" type="button" class="rounded-full bg-primary px-4 py-1.5 text-[13px] font-semibold text-background">Accept</button>
            <button id="mx-decline" type="button" class="rounded-full px-4 py-1.5 text-[13px] font-semibold bg-[color-mix(in_srgb,currentColor_10%,transparent)]">Delete</button>
          </span>
        </div>

        <div class="relative min-h-0 flex-1">
          <div id="mx-msgs" class="absolute inset-0 overflow-y-auto px-4 py-4"></div>
          <button id="mx-down" type="button" hidden aria-label="Latest" class="absolute bottom-3 right-4 flex h-10 w-10 items-center justify-center rounded-full border bg-[var(--c-card,#fff)] shadow-xl border-[color-mix(in_srgb,currentColor_12%,transparent)]">
            <span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_down</span>
          </button>
        </div>

        <div id="mx-note" class="px-4 text-[12.5px] empty:hidden"></div>
        <form id="mx-form" class="flex items-end gap-2 border-t p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] border-[color-mix(in_srgb,currentColor_12%,transparent)]">
          <textarea id="mx-input" rows="1" maxlength="4000" placeholder="Message…"
                    class="max-h-32 min-h-[44px] flex-1 resize-none rounded-3xl px-4 py-[11px] text-[15px] outline-none bg-[color-mix(in_srgb,currentColor_7%,transparent)] placeholder:opacity-50 focus:ring-2 focus:ring-primary disabled:opacity-50"></textarea>
          <button id="mx-send" type="submit" aria-label="Send" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-primary text-background shadow-lg transition hover:scale-105 active:scale-95 disabled:opacity-40 disabled:hover:scale-100">
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">send</span>
          </button>
        </form>
      </div>
    </section>
  </div>

  <!-- NEW MESSAGE SHEET -->
  <div id="mx-over" hidden class="fixed inset-0 z-[70] flex items-end justify-center bg-black/50 backdrop-blur-sm lg:items-center">
    <div class="flex max-h-[80vh] w-full flex-col rounded-t-3xl bg-[var(--c-card,#fff)] p-4 shadow-2xl lg:w-[26rem] lg:rounded-3xl">
      <div class="mb-3 flex items-center justify-between">
        <strong class="text-[17px] font-extrabold">New message</strong>
        <button id="mx-close" type="button" aria-label="Close" class="flex h-9 w-9 items-center justify-center rounded-full hover:bg-[color-mix(in_srgb,currentColor_8%,transparent)]"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
      </div>
      <form id="mx-goform"><input id="mx-handle" autocomplete="off" placeholder="Type a username and press Enter" class="w-full rounded-2xl px-4 py-2.5 text-[14px] outline-none bg-[color-mix(in_srgb,currentColor_7%,transparent)] focus:ring-2 focus:ring-primary"></form>
      <div id="mx-cands" class="mt-3 min-h-0 flex-1 overflow-y-auto"></div>
    </div>
  </div>
</div>
<script src="/static/js/cartflow-messages.js"></script>
{% endblock %}
